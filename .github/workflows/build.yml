name: Build

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Install NSIS
        shell: pwsh
        run: choco install nsis --no-progress -y

      - name: Build installer
        shell: pwsh
        run: .\tools\Release-UOTinker.ps1 -Makensis "C:\Program Files (x86)\NSIS\makensis.exe"

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: UOTinker-Setup
          path: Setup/UOTinker_Setup_*.exe
          if-no-files-found: error
